<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To Do List</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>

<body class="bg-gray-100 min-h-screen text-gray-800 antialiased">

    <!-- Main Container -->
    <section class="py-10 md:py-16">
        <div class="container mx-auto px-4">
            <div class="flex justify-center">
                <div class="w-full max-w-xl">

                    <!-- Card Container -->
                    <div class="bg-white p-6 md:p-8 rounded-xl shadow-md border border-gray-100">
                        
                        <!-- Heading to do list -->
                        <div class="mb-6 border-b border-gray-400 pb-4">
                            <h2 class="text-2xl font-bold text-gray-900 flex items-center gap-2">
                                <i class="fa-solid fa-clipboard-list text-blue-600"></i>
                                To Do List
                            </h2>
                        </div>

                        <!-- Add Task Form -->
                        <form id="todo-form" class="flex flex-col sm:flex-row gap-3">
                            <input type="text" id="todo-input"
                                class="flex-1 px-4 py-2.5 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition placeholder-gray-400 text-sm"
                                placeholder="Enter your task here...">
                            <button type="submit"
                                class="inline-flex cursor-pointer items-center justify-center gap-2 rounded-lg text-sm font-semibold text-white bg-blue-600 hover:bg-blue-700 active:bg-blue-800 transition-all px-5 py-2.5 shadow-sm">
                                <i class="fa-solid fa-plus text-xs"></i>
                                Add Task
                            </button>
                        </form>

                        <!-- Task List Section -->
                        <div class="mt-8">
                            <ul id="todo-list" class="space-y-3">
                                
                            </ul>
                        </div>

                    </div>

                </div>
            </div>
        </div>
    </section>

    <script src="script.js"></script>

</body>

</html>
